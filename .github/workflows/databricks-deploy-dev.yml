name: Databricks Development Deployment

on:
  push:
    branches:
      - main
    paths:
      - "databricks.yml"
      - "resources/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/databricks-deploy-dev.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercatura-databricks-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Mercatura development bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: databricks-dev

    permissions:
      contents: read
      id-token: write

    env:
      DATABRICKS_HOST: https://adb-7405612176581578.18.azuredatabricks.net
      DATABRICKS_AUTH_TYPE: azure-cli
      BUNDLE_VAR_ci_service_principal_name: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest-known"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest

      - name: Run Ruff linting
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

      - name: Authenticate to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.21.0

      - name: Verify Databricks deployment identity
        run: databricks current-user me

      - name: Validate bundle
        run: databricks bundle validate -t ci

      - name: Preview bundle deployment
        run: databricks bundle plan -t ci

      - name: Deploy bundle
        run: databricks bundle deploy -t ci

      - name: Run governed platform smoke test
        run: databricks bundle run -t ci catalog_smoke