resources:
  jobs:
    platform_smoke:
      name: "[${bundle.target}] Mercatura - Platform Smoke"

      tasks:
        - task_key: platform_smoke

          python_wheel_task:
            package_name: mercatura
            entry_point: platform_smoke

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl