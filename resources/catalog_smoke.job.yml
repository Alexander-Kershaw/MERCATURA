resources:
  jobs:
    catalog_smoke:
      name: "[${bundle.target}] Mercatura - Catalog Smoke"

      tasks:
        - task_key: catalog_smoke

          python_wheel_task:
            package_name: mercatura
            entry_point: catalog_smoke

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl